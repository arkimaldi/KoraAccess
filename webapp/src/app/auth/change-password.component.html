<div class="auth-wrap">
  <div class="card auth-card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h5 mb-3">{{ 'Change password' | translate }}</h1>

      <div class="alert alert-info py-2 auth-info" *ngIf="forced">{{ messages.text(requiredMessage) }}</div>
      <div class="alert alert-danger py-2 auth-error" *ngIf="error">{{ messages.text(error) }}</div>

      <form (ngSubmit)="submit()">
        <!-- Camp ocult amb el nom d'usuari: ajuda els gestors de contrasenyes a desar-la bé. -->
        <input type="text" name="username" autocomplete="username" [value]="auth.user()?.username" hidden>

        <div class="mb-3">
          <label class="form-label" for="cp-current">{{ 'Current password' | translate }}</label>
          <input id="cp-current" name="current" type="password" class="form-control"
                 autocomplete="current-password" koraAutofocus [(ngModel)]="current" [disabled]="busy">
        </div>
        <div class="mb-3">
          <label class="form-label" for="cp-new">{{ 'New password' | translate }}</label>
          <input id="cp-new" name="next" type="password" class="form-control"
                 autocomplete="new-password" [(ngModel)]="next" [disabled]="busy">
          <div class="form-text">{{ '_sys_passwordMinLength' | translate: { min: minLength } }}</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="cp-confirm">{{ 'Confirm new password' | translate }}</label>
          <input id="cp-confirm" name="confirm" type="password" class="form-control"
                 autocomplete="new-password" [(ngModel)]="confirm" [disabled]="busy">
        </div>

        <div class="d-flex gap-2">
          <button class="btn btn-primary" type="submit" [disabled]="busy || !current || !next || !confirm">
            {{ 'Change password' | translate }}
          </button>
          <button class="btn btn-outline-secondary" type="button" *ngIf="!forced" (click)="done.emit()" [disabled]="busy">
            {{ 'Cancel' | translate }}
          </button>
          <button class="btn btn-outline-secondary" type="button" *ngIf="forced" (click)="auth.logout()" [disabled]="busy">
            {{ 'Log out' | translate }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
