<div class="auth-card">
  <h2>{{ 'Change password' | translate }}</h2>

  <div class="auth-info" *ngIf="forced">{{ messages.text(requiredMessage) }}</div>
  <div class="auth-error" *ngIf="error">{{ messages.text(error) }}</div>

  <form (ngSubmit)="submit()">
    <!-- Camp ocult amb el nom d'usuari: ajuda els gestors de contrasenyes a desar-la bé. -->
    <input type="text" name="username" autocomplete="username" [value]="auth.user()?.username" hidden>

    <label for="cp-current">{{ 'Current password' | translate }}</label>
    <input id="cp-current" name="current" type="password" autocomplete="current-password"
           koraAutofocus [(ngModel)]="current" [disabled]="busy">

    <label for="cp-new">{{ 'New password' | translate }}</label>
    <input id="cp-new" name="next" type="password" autocomplete="new-password"
           [(ngModel)]="next" [disabled]="busy">
    <div class="auth-hint">{{ '_sys_passwordMinLength' | translate: { min: minLength } }}</div>

    <label for="cp-confirm">{{ 'Confirm new password' | translate }}</label>
    <input id="cp-confirm" name="confirm" type="password" autocomplete="new-password"
           [(ngModel)]="confirm" [disabled]="busy">

    <div class="auth-actions">
      <button class="btn btn-primary" type="submit" [disabled]="busy || !current || !next || !confirm">
        {{ 'Change password' | translate }}
      </button>
      <button class="btn" type="button" *ngIf="!forced" (click)="done.emit()" [disabled]="busy">
        {{ 'Cancel' | translate }}
      </button>
      <button class="btn" type="button" *ngIf="forced" (click)="auth.logout()" [disabled]="busy">
        {{ 'Log out' | translate }}
      </button>
    </div>
  </form>
</div>
